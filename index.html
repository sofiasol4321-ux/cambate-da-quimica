<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combate da Química - Versão Definitiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            background-size: cover;
            background-position: center;
        }
        .menu-btn {
            position: absolute;
            background: rgba(255, 87, 34, 0.2); 
            border: 2px dashed rgba(255, 255, 255, 0.7);
            cursor: pointer;
            border-radius: 8px;
            z-index: 50;
        }
        .menu-btn:hover {
            border-color: #ff5722;
            background: rgba(255, 87, 34, 0.5);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .active {
            display: flex;
        }
        #char-grid {
            position: absolute;
            top: 100px;
            width: 100%;
            height: 520px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 20px 40px;
            gap: 15px;
            z-index: 50;
        }
        .char-slot {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .char-slot:hover {
            border-color: #ff5722;
            transform: scale(1.05);
            background: rgba(255, 87, 34, 0.4);
        }

        /* HUD da Luta */
        #hud-luta {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 50px;
            z-index: 10;
        }
        .barra-vida-container {
            width: 400px;
            height: 30px;
            background: #333;
            border: 3px solid #ffcc00;
            transform: skewX(-20deg);
            overflow: hidden;
        }
        .barra-vida-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ffcc00);
            transition: width 0.3s;
        }
        #timer-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 4px #000;
        }

        /* Lutadores na Arena */
        #arena-lutadores {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 400px;
            pointer-events: none;
            z-index: 5;
        }
        .lutador-avatar {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 350px;
            background-size: cover;
            background-position: center;
            border: 3px solid rgba(255,255,255,0.2);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
            transition: transform 0.1s ease-out;
        }
        .fatality-ativo {
            filter: drop-shadow(0 0 25px #ff0000) brightness(1.5) !important;
            animation: piscar 0.2s infinite alternate;
        }
        @keyframes piscar {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        /* Flash Card Frente e Verso */
        #flashcard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        #img-flashcard {
            max-height: 520px;
            max-width: 900px;
            border: 3px solid #ff5722;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255,87,34,0.6);
            object-fit: contain;
        }
        .btn-acao {
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            background: #ff5722;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 60;
        }
    </style>
</head>
<body onkeydown="tratarTeclado(event)" onkeyup="tratarSolucaoTecla(event)">

    <div id="game-container" style="background-image: url('imagem menu.jpg');">
        
        <!-- TELA DO MENU PRINCIPAL -->
        <div id="main-menu" class="screen active">
            <div class="menu-btn" style="left: 45px; top: 590px; width: 120px; height: 95px;" onclick="iniciarModo('1P')" title="1 Jogador"></div>
            <div class="menu-btn" style="left: 180px; top: 590px; width: 120px; height: 95px;" onclick="iniciarModo('2P')" title="2 Jogadores"></div>
            <div class="menu-btn" style="left: 315px; top: 590px; width: 120px; height: 95px;" onclick="alert('Modo Treinamento')" title="Treinamento"></div>
            <div class="menu-btn" style="left: 450px; top: 590px; width: 120px; height: 95px;" onclick="acionarFlashCard()" title="Perguntas"></div>
            <div class="menu-btn" style="left: 585px; top: 560px; width: 140px; height: 125px;" onclick="irParaSelecaoLutador()" title="Escolher Lutador"></div>
            <div class="menu-btn" style="left: 740px; top: 590px; width: 120px; height: 95px;" onclick="alert('Química Orgânica')" title="Química Orgânica"></div>
            <div class="menu-btn" style="left: 875px; top: 590px; width: 120px; height: 95px;" onclick="alert('Opções')" title="Opções"></div>
            <div class="menu-btn" style="left: 1010px; top: 590px; width: 120px; height: 95px;" onclick="window.close()" title="Sair"></div>
        </div>

        <!-- TELA DE SELEÇÃO DE LUTADOR -->
        <div id="character-select" class="screen" style="background-image: url('imagem menu.jpg'); background-size: cover;">
            <div id="char-grid">
                <div class="char-slot" onclick="selecionarLutador('Fantasma DDT', 'fantasma ddt.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Crio-Lindano', 'CRIO-lindano- O CONGELADOR.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Enxofre Sombrio', 'ENXOFRE SOMBRIO.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Neuro-Surge', 'NEUTRO SURGE-SOBRECARGA.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Phosphorus', 'PHOSPHORUS.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Lacertôx', 'lacertrox.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Carbamask', 'carbamask.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Carbonilhawk', 'carbonilhawk.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Aldi-Carb', 'aldi-carb-inibidor.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Pyrethrix', 'pyrethrix.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Cybermeth', 'cybermeth.jfif')"></div>
                <div class="char-slot" onclick="selecionarLutador('Peltastorm', 'peltastorm.jfif')"></div>
            </div>
            <div style="position: absolute; bottom: 25px;">
                <button class="btn-acao" onclick="voltarMenu()">Voltar ao Menu</button>
            </div>
        </div>

        <!-- TELA DE LUTA -->
        <div id="fight-screen" class="screen" style="background-image: url('arena fazenda.jfjf'); background-size: cover; background-position: center;">
            <div id="hud-luta">
                <div>
                    <span id="nome-p1" style="color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 2px #000;">JOGADOR 1</span>
                    <div class="barra-vida-container"><div id="vida-p1" class="barra-vida-fill"></div></div>
                </div>
                <div id="timer-box">90</div>
                <div>
                    <span id="nome-p2" style="color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 2px #000; text-align: right; display: block;">OPONENTE</span>
                    <div class="barra-vida-container" style="transform: skewX(20deg);"><div id="vida-p2" class="barra-vida-fill"></div></div>
                </div>
            </div>

            <div id="arena-lutadores">
                <div id="avatar-p1" class="lutador-avatar"></div>
                <div id="avatar-p2" class="lutador-avatar" style="transform: scaleX(-1);"></div>
            </div>

            <div style="position: absolute; bottom: 20px; z-index: 20; display: flex; gap: 15px;">
                <button class="btn-acao" onclick="acionarFlashCard()">Chamar Pergunta (Flash Card)</button>
                <button class="btn-acao" style="background: #4caf50;" onclick="ativarFatalityManual()">Ativar Fatality (Shift)</button>
            </div>
        </div>

        <!-- FLASH CARD FRENTE E VERSO -->
        <div id="flashcard-overlay">
            <h2 id="turno-texto" style="color: #ffcc00; margin-bottom: 10px; text-shadow: 2px 2px 4px #000;"></h2>
            <img id="img-flashcard" src="">
            <p id="instrucao-flash" style="margin-top: 15px; color: #fff; font-size: 1.1rem; text-shadow: 1px 1px 2px #000; text-align: center;"></p>
        </div>

    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function tocarSom(tipo) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if(tipo === 'clique') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(tipo === 'acerto') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(tipo === 'erro') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(tipo === 'fatality') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        let modoAtual = '1P';
        let p1Nome = "Jogador 1";
        let p2Nome = "Robô (IA)";
        let p1AvatarImg = "fantasma ddt.jfif";
        let p2AvatarImg = "lacertrox.jfif";
        let turnoJogador = "";
        let flashCardAtivo = false;
        let visualizandoVerso = false;
        let p1Vida = 100;
        let p2Vida = 100;
        let fatalityDisponivel = false;
        let perguntaAtualNum = 1;

        let p1X = 150;
        let p1Y = 0;
        let p1Agachado = false;

        function irParaSelecaoLutador() {
            tocarSom('clique');
            document.getElementById('main-menu').classList.remove('active');
            document.getElementById('character-select').classList.add('active');
        }

        function voltarMenu() {
            tocarSom('clique');
            document.getElementById('character-select').classList.remove('active');
            document.getElementById('fight-screen').classList.remove('active');
            document.getElementById('flashcard-overlay').style.display = 'none';
            document.getElementById('main-menu').classList.add('active');
            document.getElementById('game-container').style.backgroundImage = "url('imagem menu.jpg')";
        }

        function iniciarModo(modo) {
            tocarSom('clique');
            modoAtual = modo;
            if(modo === '2P') p2Nome = "Jogador 2";
            irParaSelecaoLutador();
        }

        function selecionarLutador(nome, imagemArquivo) {
            tocarSom('clique');
            p1Nome = nome;
            p1AvatarImg = imagemArquivo;
            
            document.getElementById('nome-p1').innerText = p1Nome;
            document.getElementById('nome-p2').innerText = p2Nome;
            document.getElementById('avatar-p1').style.backgroundImage = `url('${p1AvatarImg}')`;
            document.getElementById('avatar-p2').style.backgroundImage = `url('${p2AvatarImg}')`;

            document.getElementById('character-select').classList.remove('active');
            document.getElementById('fight-screen').classList.add('active');
            document.getElementById('game-container').style.backgroundImage = "url('arena fazenda.jfjf')";
            
            p1X = 150;
            p1Y = 0;
            atualizarPosicaoLutador();
        }

        function atualizarPosicaoLutador() {
            let avatar = document.getElementById('avatar-p1');
            avatar.style.left = p1X + 'px';
            avatar.style.bottom = p1Y + 'px';
            if (p1Agachado) {
                avatar.style.transform = 'scaleY(0.6)';
            } else {
                avatar.style.transform = 'scaleY(1)';
            }
        }

        function acionarFlashCard() {
            tocarSom('clique');
            turnoJogador = Math.random() > 0.5 ? p1Nome : p2Nome;

            // Sorteia uma pergunta entre 1 e 5 combinando com os arquivos do seu GitHub
            perguntaAtualNum = Math.floor(Math.random() * 5) + 1;
            let arquivoFrente = `pergunta ${perguntaAtualNum}- frente.jfif`;
            if(perguntaAtualNum === 4) arquivoFrente = "pergunta 4-frente.jfif"; // Tratamento para espaçamento do GitHub

            document.getElementById('turno-texto').innerText = `⚡ HORA DA QUÍMICA! Responde: ${turnoJogador} ⚡`;
            document.getElementById('img-flashcard').src = arquivoFrente;
            document.getElementById('instrucao-flash').innerText = "Pressione 'D' ou 'E' para responder e ver o verso!";
            
            flashCardAtivo = true;
            visualizandoVerso = false;
            document.getElementById('flashcard-overlay').style.display = 'flex';
        }

        function tratarTeclado(e) {
            let key = e.key.toLowerCase();

            if (e.key === 'Escape') {
                if (flashCardAtivo) {
                    document.getElementById('flashcard-overlay').style.display = 'none';
                    flashCardAtivo = false;
                } else {
                    voltarMenu();
                }
                return;
            }

            if (flashCardAtivo) {
                if (!visualizandoVerso) {
                    if (key === 'd') {
                        tocarSom('acerto');
                        visualizandoVerso = true;
                        
                        let arquivoVerso = `pergunta ${perguntaAtualNum}- verso.jfif`;
                        if(perguntaAtualNum === 4) arquivoVerso = "pergunta 4- verso.jfif";
                        
                        document.getElementById('img-flashcard').src = arquivoVerso;
                        document.getElementById('turno-texto').innerText = `✅ RESPOSTA CORRETA! ${turnoJogador} ganhou o prêmio!`;
                        document.getElementById('instrucao-flash').innerText = "Prêmio: Ganhou + Vida & Fatality Liberado! Pressione [ESPAÇO] para voltar à luta.";
                        
                        p1Vida = Math.min(100, p1Vida + 20);
                        document.getElementById('vida-p1').style.width = p1Vida + '%';
                        fatalityDisponivel = true;
                    } else if (key === 'e') {
                        tocarSom('erro');
                        visualizandoVerso = true;
                        let adversario = (turnoJogador === p1Nome) ? p2Nome : p2Nome;
                        
                        let arquivoVerso = `pergunta ${perguntaAtualNum}- verso.jfif`;
                        if(perguntaAtualNum === 4) arquivoVerso = "pergunta 4- verso.jfif";

                        document.getElementById('img-flashcard').src = arquivoVerso;
                        document.getElementById('turno-texto').innerText = `❌ RESPOSTA INCORRETA! O prêmio passou para ${adversario}!`;
                        document.getElementById('instrucao-flash').innerText = "O oponente ganhou vantagem! Pressione [ESPAÇO] para voltar à luta.";
                        
                        p2Vida = Math.min(100, p2Vida + 20);
                        document.getElementById('vida-p2').style.width = p2Vida + '%';
                    }
                } else {
                    if (e.key === ' ') {
                        tocarSom('clique');
                        document.getElementById('flashcard-overlay').style.display = 'none';
                        flashCardAtivo = false;
                    }
                }
                return;
            }

            if (document.getElementById('fight-screen').classList.contains('active')) {
                if (key === 'w') {
                    p1X += 20;
                    atualizarPosicaoLutador();
                } else if (key === 's') {
                    p1X = Math.max(20, p1X - 20);
                    atualizarPosicaoLupador();
                } else if (key === 'a') {
                    tocarSom('clique');
                    let avatarP2 = document.getElementById('avatar-p2');
                    avatarP2.style.transform = 'scaleX(-1) translateX(20px)';
                    setTimeout(() => { avatarP2.style.transform = 'scaleX(-1) translateX(0)'; }, 150);
                    p2Vida = Math.max(0, p2Vida - 10);
                    document.getElementById('vida-p2').style.width = p2Vida + '%';
                } else if (e.key === ' ') {
                    p1Y = 80;
                    atualizarPosicaoLutador();
                    setTimeout(() => {
                        p1Y = 0;
                        atualizarPosicaoLutador();
                    }, 400);
                } else if (e.key === 'Control') {
                    p1Agachado = true;
                    atualizarPosicaoLutador();
                } else if (e.key === 'Shift' || key === 'shift') {
                    ativarFatalityManual();
                }
            }
        }

        function tratarSolucaoTecla(e) {
            if (e.key === 'Control') {
                p1Agachado = false;
                atualizarPosicaoLutador();
            }
        }

        function ativarFatalityManual() {
            if (fatalityDisponivel) {
                tocarSom('fatality');
                let avatarP1 = document.getElementById('avatar-p1');
                let avatarP2 = document.getElementById('avatar-p2');
                
                avatarP1.classList.add('fatality-ativo');
                alert("FATALITY ATIVADO! O personagem brilhou e o adversário foi destruído!");
                
                p2Vida = 0;
                document.getElementById('vida-p2').style.width = '0%';
                avatarP2.style.opacity = '0.1';
                
                setTimeout(() => {
                    avatarP1.classList.remove('fatality-ativo');
                    avatarP2.style.opacity = '1';
                    fatalityDisponivel = false;
                }, 2000);
            } else {
                alert("Fatality Indisponível! Você precisa acertar uma pergunta no Flash Card primeiro para ganhar o direito ao Fatality.");
            }
        }
    </script>
</body>
</html>
