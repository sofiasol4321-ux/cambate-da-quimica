<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Combate da Química</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;

        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* TELA DO JOGO */

        .game-screen {

            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000;

        }


        /* IMAGEM DO MENU */

        .menu-image {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            user-select: none;

        }


        /*

        BOTÕES INVISÍVEIS

        Eles ficam por cima da imagem.

        Depois vamos transformar cada um
        em uma função real do jogo.

        */


        .menu-button {

            position: absolute;

            border: none;

            background: transparent;

            cursor: pointer;

            z-index: 10;

        }


        /*
        1 JOGADOR
        */

        .btn-player1 {

            left: 7%;

            bottom: 20%;

            width: 16%;

            height: 5%;

        }


        /*
        2 JOGADORES
        */

        .btn-player2 {

            left: 7%;

            bottom: 14%;

            width: 16%;

            height: 5%;

        }


        /*
        TREINAMENTO
        */

        .btn-training {

            left: 7%;

            bottom: 8%;

            width: 16%;

            height: 5%;

        }


        /*
        OPÇÕES
        */

        .btn-options {

            left: 7%;

            bottom: 2%;

            width: 16%;

            height: 5%;

        }


        /*
        EFEITO AO PASSAR O MOUSE
        */

        .menu-button:hover {

            background: rgba(
                255,
                190,
                60,
                0.12
            );

            box-shadow:
                0 0 20px
                rgba(
                    255,
                    190,
                    60,
                    0.35
                );

        }


        /* JANELA */

        .modal {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            background:
                rgba(0, 0, 0, 0.88);

            z-index: 100;

        }


        .modal.active {

            display: flex;

        }


        .modal-box {

            width: min(
                500px,
                90%
            );

            padding: 35px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #070707
                );

            border:
                2px solid
                #c2943e;

            box-shadow:
                0 0 40px
                rgba(0, 0, 0, 0.9);

        }


        .modal-box h2 {

            margin-bottom: 15px;

            color: #e4bd65;

            font-size: 28px;

            letter-spacing: 2px;

        }


        .modal-box p {

            color: #ddd;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        .close-button {

            border: none;

            padding:
                12px 30px;

            background: #8d2929;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .close-button:hover {

            background: #b43737;

        }

    </style>

</head>


<body>


    <main class="game-screen">


        <!--
        IMAGEM ORIGINAL DO MENU
        -->

        <img

            src="WhatsApp%20Image%202026-08-29%20at%2016.05.19.jpeg"

            alt="Menu do Combate da Química"

            class="menu-image"

        >


        <!-- 1 JOGADOR -->

        <button

            class="menu-button btn-player1"

            onclick="abrirMenu('1 JOGADOR')"

            aria-label="1 Jogador">

        </button>


        <!-- 2 JOGADORES -->

        <button

            class="menu-button btn-player2"

            onclick="abrirMenu('2 JOGADORES')"

            aria-label="2 Jogadores">

        </button>


        <!-- TREINAMENTO -->

        <button

            class="menu-button btn-training"

            onclick="abrirMenu('TREINAMENTO')"

            aria-label="Treinamento">

        </button>


        <!-- OPÇÕES -->

        <button

            class="menu-button btn-options"

            onclick="abrirMenu('OPÇÕES')"

            aria-label="Opções">

        </button>


    </main>


    <!-- JANELA -->

    <div
        class="modal"
        id="modal">


        <div class="modal-box">


            <h2 id="modal-title">

                COMBATE DA QUÍMICA

            </h2>


            <p id="modal-text">

                Carregando...

            </p>


            <button

                class="close-button"

                onclick="fecharMenu()">

                VOLTAR

            </button>


        </div>

    </div>


    <script>


        function abrirMenu(opcao) {


            document
                .getElementById("modal-title")
                .textContent = opcao;


            document
                .getElementById("modal-text")
                .textContent =
                "Essa função será desenvolvida nas próximas etapas do jogo.";


            document
                .getElementById("modal")
                .classList
                .add("active");

        }


        function fecharMenu() {


            document
                .getElementById("modal")
                .classList
                .remove("active");

        }


    </script>


</body>

</html>
