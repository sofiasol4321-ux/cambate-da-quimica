<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combate da Química</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ÁREA PRINCIPAL DO JOGO */
        .game-screen {
            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;
        }

        /* IMAGEM DO MENU */
        .menu-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            user-select: none;
            -webkit-user-drag: none;
        }

        /*
        ÁREAS INVISÍVEIS DE CLIQUE

        Elas ficam sobre a imagem.
        Mais tarde vamos ligar cada uma delas
        às telas reais do jogo.
        */

        .menu-button {
            position: absolute;

            border: none;
            background: transparent;

            cursor: pointer;

            z-index: 10;
        }

        /*
        Menu lateral da arte.

        As posições estão em porcentagem para
        funcionar também em telas diferentes.
        */

        .btn-player1 {
            left: 8%;
            bottom: 20%;
            width: 14%;
            height: 5%;
        }

        .btn-player2 {
            left: 8%;
            bottom: 14.5%;
            width: 14%;
            height: 5%;
        }

        .btn-training {
            left: 8%;
            bottom: 9%;
            width: 14%;
            height: 5%;
        }

        .btn-options {
            left: 8%;
            bottom: 3.5%;
            width: 14%;
            height: 5%;
        }

        /*
        Efeito visual ao passar o mouse.

        Como o botão é transparente, ele só cria
        um pequeno brilho para sabermos onde clicar.
        */

        .menu-button:hover {
            background: rgba(255, 190, 60, 0.08);

            box-shadow:
                0 0 15px rgba(255, 190, 60, 0.25);

            border-radius: 4px;
        }

        /* JANELA DE AVISO */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.85);

            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: min(500px, 90%);

            padding: 35px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #080808
                );

            border: 2px solid #c2943e;

            box-shadow:
                0 0 35px rgba(0, 0, 0, 0.9);
        }

        .modal-box h2 {
            margin-bottom: 15px;

            color: #e4bd65;

            font-size: 28px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .modal-box p {
            color: #ccc;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .close-button {
            border: none;

            padding: 12px 30px;

            background: #8d2929;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .close-button:hover {
            background: #b43737;

            transform: scale(1.05);
        }

        /*
        RESPONSIVIDADE

        Em celulares/tablets a imagem continua
        ocupando toda a tela sem deformar.
        */

        @media (max-width: 700px) {

            .menu-button {
                /*
                Mantém as áreas clicáveis
                proporcionais à imagem.
                */
            }
        }
    </style>
</head>

<body>

    <main class="game-screen">

        <!-- SUA IMAGEM DO MENU -->

        <img
            src="imagem_menu.jpg"
            alt="Menu do Combate da Química"
            class="menu-image"
        >


        <!-- BOTÕES INVISÍVEIS SOBRE A ARTE -->

        <button
            class="menu-button btn-player1"
            onclick="abrirMenu('1 JOGADOR')"
            aria-label="1 Jogador">
        </button>

        <button
            class="menu-button btn-player2"
            onclick="abrirMenu('2 JOGADORES')"
            aria-label="2 Jogadores">
        </button>

        <button
            class="menu-button btn-training"
            onclick="abrirMenu('TREINAMENTO')"
            aria-label="Treinamento">
        </button>

        <button
            class="menu-button btn-options"
            onclick="abrirMenu('OPÇÕES')"
            aria-label="Opções">
        </button>

    </main>


    <!-- JANELA QUE APARECE AO CLICAR -->

    <div
        class="modal"
        id="modal">

        <div class="modal-box">

            <h2 id="modal-title">
                Combate da Química
            </h2>

            <p id="modal-text">
                Carregando...
            </p>

            <button
                class="close-button"
                onclick="fecharMenu()">

                VOLTAR

            </button>

        </div>

    </div>


    <script>

        function abrirMenu(opcao) {

            document.getElementById("modal-title")
                .textContent = opcao;

            document.getElementById("modal-text")
                .textContent =
                "Essa parte do Combate da Química será desenvolvida agora. Em breve você poderá escolher personagens, arenas e iniciar a batalha.";

            document.getElementById("modal")
                .classList.add("active");
        }


        function fecharMenu() {

            document.getElementById("modal")
                .classList.remove("active");
        }

    </script>

</body>
</html>
