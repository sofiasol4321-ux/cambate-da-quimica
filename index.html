<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combate da Química</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            background-size: cover;
            background-position: center;
        }
        /* Botões invisíveis mapeados em cima da imagem do menu (WhatsApp ...20.jpeg) */
        .menu-btn {
            position: absolute;
            background: rgba(255, 0, 0, 0); /* Mude para 0.2 se quiser enxergar os botões para testar */
            border: 2px dashed rgba(255, 255, 255, 0);
            cursor: pointer;
        }
        .menu-btn:hover {
            border-color: #ff5722;
            background: rgba(255, 87, 34, 0.2);
        }
        
        /* Telas internas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .active {
            display: flex;
        }
        
        /* Grade para selecionar os lutadores na tela WhatsApp ...19.jpeg */
        #char-grid {
            position: absolute;
            top: 120px;
            width: 100%;
            height: 520px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 20px 40px;
            gap: 15px;
        }
        .char-slot {
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .char-slot:hover {
            border-color: #ff5722;
            transform: scale(1.05);
            background: rgba(255, 87, 34, 0.3);
        }

        h1 {
            color: #ff5722;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>

    <div id="game-container" style="background-image: url('WhatsApp Image 2026-08-30 at 16.00.20.jpeg');">
        
        <!-- TELA DO MENU PRINCIPAL -->
        <div id="main-menu" class="screen active" style="width: 100%; height: 100%; position: relative; display: flex;">
            <!-- Botões organizados na parte inferior da imagem do menu -->
            <div class="menu-btn" style="left: 65px; top: 620px; width: 110px; height: 80px;" onclick="iniciarModo('1P')"></div>
            <div class="menu-btn" style="left: 195px; top: 620px; width: 110px; height: 80px;" onclick="iniciarModo('2P')"></div>
            <div class="menu-btn" style="left: 325px; top: 620px; width: 110px; height: 80px;" onclick="alert('Modo Treinamento selecionado!')"></div>
            <div class="menu-btn" style="left: 455px; top: 620px; width: 110px; height: 80px;" onclick="alert('Perguntas de Química Orgânica!')"></div>
            <div class="menu-btn" style="left: 585px; top: 590px; width: 110px; height: 110px;" onclick="irParaSelecaoLutador()"></div>
            <div class="menu-btn" style="left: 715px; top: 620px; width: 110px; height: 80px;" onclick="alert('Química Orgânica - Informações')"></div>
            <div class="menu-btn" style="left: 845px; top: 620px; width: 110px; height: 80px;" onclick="alert('Opções do Jogo')"></div>
            <div class="menu-btn" style="left: 975px; top: 620px; width: 110px; height: 80px;" onclick="window.close()"></div>
        </div>

        <!-- TELA DE SELEÇÃO DE LUTADOR (Usa a imagem ...19.jpeg) -->
        <div id="character-select" class="screen" style="background-image: url('WhatsApp Image 2026-08-29 at 16.05.19.jpeg'); background-size: cover;">
            
            <!-- Grade de cliques invisível em cima dos 12 cards de personagens da imagem -->
            <div id="char-grid">
                <div class="char-slot" onclick="selecionarLutador('Fantasma DDT')"></div>
                <div class="char-slot" onclick="selecionarLutador('Crio-Lindano')"></div>
                <div class="char-slot" onclick="selecionarLutador('Enxofre Sombrio')"></div>
                <div class="char-slot" onclick="selecionarLutador('Neuro-Surge')"></div>
                <div class="char-slot" onclick="selecionarLutador('Phosphorus')"></div>
                <div class="char-slot" onclick="selecionarLutador('Lacertôx')"></div>
                <div class="char-slot" onclick="selecionarLutador('Carbamask')"></div>
                <div class="char-slot" onclick="selecionarLutador('Carbonilhawk')"></div>
                <div class="char-slot" onclick="selecionarLutador('Aldi-Carb')"></div>
                <div class="char-slot" onclick="selecionarLutador('Pyrethrix')"></div>
                <div class="char-slot" onclick="selecionarLutador('Cybermeth')}}"></div>
                <div class="char-slot" onclick="selecionarLutador('Peltastorm')"></div>
            </div>

            <div style="position: absolute; bottom: 15px;">
                <button onclick="voltarMenu()" style="padding: 8px 16px; cursor: pointer; background: #ff5722; color: #fff; border: none; border-radius: 4px; font-weight: bold;">Voltar ao Menu</button>
            </div>
        </div>

        <!-- TELA DE LUTA -->
        <div id="fight-screen" class="screen">
            <h1 id="fight-title">Combate Iniciado</h1>
            <p id="fight-info" style="margin-top: 10px;">Preparando a arena...</p>
            <br>
            <button onclick="voltarMenu()" style="padding: 10px 20px; cursor: pointer; background: #ff5722; color: #fff; border: none; border-radius: 5px;">Encerrar / Voltar</button>
        </div>

    </div>

    <script>
        let modoAtual = '1P';
        let jogador1Escolhido = null;

        function irParaSelecaoLutador() {
            document.getElementById('main-menu').classList.remove('active');
            document.getElementById('character-select').classList.add('active');
        }

        function voltarMenu() {
            document.getElementById('character-select').classList.remove('active');
            document.getElementById('fight-screen').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
        }

        function iniciarModo(modo) {
            modoAtual = modo;
            // Se clicar direto em 1P ou 2P, já manda pra seleção de lutador com o modo salvo
            irParaSelecaoLutador();
        }

        function selecionarLutador(nomeLutador) {
            jogador1Escolhido = nomeLutador;
            document.getElementById('character-select').classList.remove('active');
            document.getElementById('fight-screen').classList.add('active');
            
            if(modoAtual === '1P') {
                document.getElementById('fight-title').innerText = "Modo 1 Jogador: " + nomeLutador + " vs Robô (IA)";
                document.getElementById('fight-info').innerText = "O bot de inteligência artificial está pronto para o combate!";
            } else {
                document.getElementById('fight-title').innerText = "Modo 2 Jogadores: " + nomeLutador + " (P1) vs Oponente (P2)";
                document.getElementById('fight-info').innerText = "Controles de teclado e manetes ativados.";
            }
        }

        // Detecção de controles/manetes USB ou Bluetooth conectados
        window.addEventListener("gamepadconnected", (e) => {
            console.log("Gamepad conectado:", e.gamepad.id);
            alert("Controle conectado: " + e.gamepad.id);
        });
    </script>
</body>
</html>
